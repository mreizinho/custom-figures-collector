<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom Figures Collector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="palette.css?v=20260714" />
</head>
<body>
  <header class="topbar"><a class="brand" href="#"><span class="brick material-symbols-rounded">view_in_ar</span> Custom Figures Collector</a><button id="theme" aria-label="Toggle colour theme"><span class="material-symbols-rounded">contrast</span></button></header>
  <main>
    <section class="stats" aria-label="Collection statistics"><article><span>Total figures</span><strong id="totalCount">—</strong><small>catalogued</small></article><article class="owned-stat"><span>Owned</span><strong id="ownedStat">—</strong><div class="stat-foot"><small id="ownedValue">—</small><div class="currency-toggle" aria-label="Total value currency"><button class="active" data-currency="EUR" title="EUR" aria-label="Show total in EUR">€</button><button data-currency="USD" title="USD" aria-label="Show total in USD">$</button></div></div></article><article><span>Wishlist</span><strong id="wishStat">—</strong><small>figures to find</small></article><article><span>Brands</span><strong id="brandStat">—</strong><small>in your catalogue</small></article></section>
    <div class="results-summary"><span id="resultCount" aria-live="polite">Loading catalogue…</span></div>
    <section class="toolbar"><label class="search"><span class="material-symbols-rounded">search</span><input id="search" type="search" placeholder="Search name, brand or tag…"></label><div class="view-buttons"><button class="active" id="gridView" aria-label="Grid view"><span class="material-symbols-rounded">grid_view</span></button><button id="listView" aria-label="List view"><span class="material-symbols-rounded">format_list_bulleted</span></button></div></section>
    <section class="content"><aside id="filters" class="filters"><div class="filter-heading"><strong>Filter by</strong><button id="clearFilters" hidden>Clear all</button></div><div><h3>Collection</h3><label><input type="checkbox" value="owned" class="state-filter"> Owned</label><label><input type="checkbox" value="wishlist" class="state-filter"> Wishlist</label></div><div><h3>Condition</h3><label><input type="checkbox" value="new" class="condition-filter"> New</label><label><input type="checkbox" value="used" class="condition-filter"> Used</label></div><div><h3>Brand</h3><div id="brandFilters"></div></div><div><h3>Tags</h3><div id="tagFilters" class="tag-filters"></div></div></aside><section class="results"><div class="results-head"><div class="results-controls"><button class="filter-toggle" id="filterToggle"><span class="material-symbols-rounded">tune</span> Filters <span id="filterCount"></span></button><div class="sort-control"><button id="sortMenuToggle" class="sort-menu-toggle" aria-label="Sort figures" aria-expanded="false"><span class="material-symbols-rounded sort-icon">swap_vert</span><span id="sortLabel">Name</span><span class="material-symbols-rounded select-arrow">expand_more</span></button><div id="sortMenu" class="sort-menu" role="menu" hidden><button data-sort-field="name">Name</button><button data-sort-field="brand">Brand</button><button data-sort-field="value">Value</button><hr><button data-sort-direction="asc">Ascending</button><button data-sort-direction="desc">Descending</button></div></div></div></div><div id="catalogue" class="catalogue"></div><div id="empty" class="empty-state" hidden><span class="material-symbols-rounded">search_off</span><h2>No figures found</h2><p>Try a different search or clear the active filters.</p><button id="resetEmpty">Clear filters</button></div></section></section>
  </main>
  <dialog id="detail"><button class="close" id="closeDetail" aria-label="Close"><span class="material-symbols-rounded">close</span></button><div id="detailContent"></div></dialog>
  <template id="cardTemplate"><article class="card"><button class="image-button"><div class="image-wrap"><img loading="lazy"><span class="placeholder">MINIFIG</span></div></button><div class="card-body"><span class="condition"></span><p class="brand"></p><h2></h2><div class="card-bottom"><span class="price"></span><div class="actions"><button class="own" title="Toggle owned status" aria-label="Toggle owned status"><span class="material-symbols-rounded">check</span></button><button class="wish" title="Toggle wishlist status" aria-label="Toggle wishlist status"><span class="material-symbols-rounded">favorite</span></button></div></div></div></article></template>
  <script src="app.js"></script>
</body></html>
