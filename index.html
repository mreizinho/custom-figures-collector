<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom Figures Collector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="header.css" />
  <link rel="stylesheet" href="palette.css" />
</head>
<body>
  <header class="topbar"><a class="brand" href="#"><span class="brick">▦</span> Custom Figures Collector</a><button id="theme" aria-label="Toggle colour theme">◐</button></header>
  <main>
    <section class="stats" aria-label="Collection statistics"><article><span>Total figures</span><strong id="totalCount">—</strong><small>catalogued</small></article><article><span>Owned</span><strong id="ownedStat">—</strong><small id="ownedValue">—</small></article><article><span>Wishlist</span><strong id="wishStat">—</strong><small>figures to find</small></article><article><span>Collection value</span><strong id="valueStat">—</strong><small>estimated</small></article><article><span>Brands</span><strong id="brandStat">—</strong><small>in your catalogue</small></article></section>
    <section class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search name, brand or tag…"></label><button class="filter-toggle" id="filterToggle">Filters <span id="filterCount"></span></button><div class="view-buttons"><button class="active" id="gridView" aria-label="Grid view">▦</button><button id="listView" aria-label="List view">☷</button></div></section>
    <section class="content"><aside id="filters" class="filters"><div class="filter-heading"><strong>Filter by</strong><button id="clearFilters" hidden>Clear all</button></div><div><h3>Collection</h3><label><input type="checkbox" value="owned" class="state-filter"> Owned</label><label><input type="checkbox" value="wishlist" class="state-filter"> Wishlist</label></div><div><h3>Condition</h3><label><input type="checkbox" value="new" class="condition-filter"> New</label><label><input type="checkbox" value="used" class="condition-filter"> Used</label></div><div><h3>Brand</h3><div id="brandFilters"></div></div><div><h3>Tags</h3><div id="tagFilters" class="tag-filters"></div></div></aside><section><div class="results-head"><span id="resultCount">Loading catalogue…</span><select id="sort"><option value="name">Name, A–Z</option><option value="value-desc">Value, high to low</option><option value="value-asc">Value, low to high</option><option value="brand">Brand</option></select></div><div id="catalogue" class="catalogue"></div><p id="empty" hidden>No figures match these filters.</p></section></section>
  </main>
  <dialog id="detail"><button class="close" id="closeDetail" aria-label="Close">×</button><div id="detailContent"></div></dialog>
  <template id="cardTemplate"><article class="card"><button class="image-button"><div class="image-wrap"><img loading="lazy"><span class="placeholder">MINIFIG</span></div></button><div class="card-body"><span class="condition"></span><p class="brand"></p><h2></h2><div class="card-bottom"><span class="price"></span><div class="actions"><button class="own" title="Toggle owned status" aria-label="Toggle owned status">✓</button><button class="wish" title="Toggle wishlist status" aria-label="Toggle wishlist status">♡</button></div></div></div></article></template>
  <script src="app.js"></script>
</body></html>
