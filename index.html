<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom Figures Collector</title>
  <link rel="icon" type="image/png" href="lego-head-outline-50.png" />
  <link rel="icon" type="image/png" href="lego-head-outline-50.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="favicon-dark.svg" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="header.css?v=20260718-9" />
  <link rel="stylesheet" href="palette.css?v=20260718-8" />
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true"><img class="brand-icon-outline" width="28" height="28" src="lego-head-outline-50.png" srcset="lego-head-outline-100.png 2x" alt=""><img class="brand-icon-filled" width="28" height="28" src="lego-head-filled-50.png" srcset="lego-head-filled-100.png 2x" alt=""></span><span class="brand-name">CUSTOM FIGURES</span><button id="accentPickerToggle" class="brand-accent" aria-label="Change Color" title="Change Color" aria-expanded="false">COLLECTOR</button><div id="accentPicker" class="accent-picker" hidden><span>Accent color</span><div class="accent-swatches"><button data-accent="#ff5a35" style="--swatch:#ff5a35" aria-label="Orange"></button><button data-accent="#ffc000" style="--swatch:#ffc000" aria-label="Amber"></button><button data-accent="#ffff00" style="--swatch:#ffff00" aria-label="Yellow"></button><button data-accent="#92d050" style="--swatch:#92d050" aria-label="Green"></button><button data-accent="#0f9d8a" style="--swatch:#0f9d8a" aria-label="Teal"></button><button data-accent="#00b0f0" style="--swatch:#00b0f0" aria-label="Cyan"></button><button data-accent="#0070c0" style="--swatch:#0070c0" aria-label="Blue"></button><button data-accent="#8b5cf6" style="--swatch:#8b5cf6" aria-label="Purple"></button><button data-accent="#db2777" style="--swatch:#db2777" aria-label="Pink"></button><button id="recentCustomSwatch" data-accent="#ff5a35" style="--swatch:#ff5a35" aria-label="Recent custom color"></button></div><button id="openCustomAccent" class="open-custom-accent"><span>Custom color</span><span class="material-symbols-rounded">chevron_right</span></button><div id="customColorPanel" class="custom-color-panel" hidden><div class="color-picker-field"><canvas id="colorCanvas" width="144" height="112" aria-label="Saturation and brightness"></canvas><input id="colorHue" type="range" min="0" max="360" value="10" aria-label="Hue"></div><div class="custom-color-value"><span id="customColorPreview"></span><input id="customHex" value="#ff5a35" maxlength="7" aria-label="Hex color"></div><div class="color-number-row"><span>RGB</span><span class="color-number-control"><input id="customRed" type="number" min="0" max="255" aria-label="Red"><span class="color-stepper"><button type="button" data-step-target="customRed" data-step="1" aria-label="Increase Red"><span class="material-symbols-rounded">keyboard_arrow_up</span></button><button type="button" data-step-target="customRed" data-step="-1" aria-label="Decrease Red"><span class="material-symbols-rounded">keyboard_arrow_down</span></button></span></span><span class="color-number-control"><input id="customGreen" type="number" min="0" max="255" aria-label="Green"><span class="color-stepper"><button type="button" data-step-target="customGreen" data-step="1" aria-label="Increase Green"><span class="material-symbols-rounded">keyboard_arrow_up</span></button><button type="button" data-step-target="customGreen" data-step="-1" aria-label="Decrease Green"><span class="material-symbols-rounded">keyboard_arrow_down</span></button></span></span><span class="color-number-control"><input id="customBlue" type="number" min="0" max="255" aria-label="Blue"><span class="color-stepper"><button type="button" data-step-target="customBlue" data-step="1" aria-label="Increase Blue"><span class="material-symbols-rounded">keyboard_arrow_up</span></button><button type="button" data-step-target="customBlue" data-step="-1" aria-label="Decrease Blue"><span class="material-symbols-rounded">keyboard_arrow_down</span></button></span></span></div><div class="color-number-row"><span>HSB</span><span class="color-number-control"><input id="customHueValue" type="number" min="0" max="360" aria-label="Hue"><span class="color-stepper"><button type="button" data-step-target="customHueValue" data-step="1" aria-label="Increase Hue"><span class="material-symbols-rounded">keyboard_arrow_up</span></button><button type="button" data-step-target="customHueValue" data-step="-1" aria-label="Decrease Hue"><span class="material-symbols-rounded">keyboard_arrow_down</span></button></span></span><span class="color-number-control"><input id="customSaturation" type="number" min="0" max="100" aria-label="Saturation"><span class="color-stepper"><button type="button" data-step-target="customSaturation" data-step="1" aria-label="Increase Saturation"><span class="material-symbols-rounded">keyboard_arrow_up</span></button><button type="button" data-step-target="customSaturation" data-step="-1" aria-label="Decrease Saturation"><span class="material-symbols-rounded">keyboard_arrow_down</span></button></span></span><span class="color-number-control"><input id="customBrightness" type="number" min="0" max="100" aria-label="Brightness"><span class="color-stepper"><button type="button" data-step-target="customBrightness" data-step="1" aria-label="Increase Brightness"><span class="material-symbols-rounded">keyboard_arrow_up</span></button><button type="button" data-step-target="customBrightness" data-step="-1" aria-label="Decrease Brightness"><span class="material-symbols-rounded">keyboard_arrow_down</span></button></span></span></div><div class="custom-color-actions"><button id="cancelCustomAccent">Cancel</button><button id="applyCustomAccent">OK</button></div></div></div></div><div class="header-actions"><button id="statsToggle" aria-label="Hide Statistics" aria-pressed="true" title="Hide Statistics"><span class="material-symbols-rounded">expand_less</span></button><button id="theme" aria-label="Switch to Dark Mode" title="Switch to Dark Mode"><span class="material-symbols-rounded">contrast</span></button></div></header>
  <main>
    <section class="stats" aria-label="Collection statistics"><article><span>Total figures</span><strong id="totalCount">—</strong><small>catalogued</small></article><article class="owned-stat"><span>Owned</span><strong id="ownedStat">—</strong><div class="stat-foot"><small id="ownedValue">—</small><div class="currency-toggle" aria-label="Total value currency"><button class="active" data-currency="EUR" title="EUR" aria-label="Show total in EUR">€</button><button data-currency="USD" title="USD" aria-label="Show total in USD">$</button></div></div></article><article><span>Wishlist</span><strong id="wishStat">—</strong><small>figures to find</small></article><article><span>Brands</span><strong id="brandStat">—</strong><small>in your catalogue</small></article></section>
    <div class="results-summary"><span id="resultCount" aria-live="polite">Loading catalogue…</span></div>
    <section class="toolbar"><label class="search"><span class="material-symbols-rounded">search</span><input id="search" type="search" placeholder="Search name, brand or tag…"></label><div class="view-buttons"><button class="active" id="gridView" aria-label="Grid view"><span class="material-symbols-rounded">grid_view</span></button><button id="listView" aria-label="List view"><span class="material-symbols-rounded">format_list_bulleted</span></button></div></section>
    <section class="content"><aside id="filters" class="filters"><div class="filter-heading"><strong>Filter by</strong><button id="clearFilters" hidden>Clear all</button></div><div class="filter-columns"><div class="filter-section filter-brand"><h3>Brand</h3><div id="brandFilters"></div></div><div class="filter-secondary"><div class="filter-section filter-collection"><h3>Collection</h3><label><input type="checkbox" value="owned" class="state-filter"> Owned</label><label><input type="checkbox" value="wishlist" class="state-filter"> Wishlist</label></div><div class="filter-section filter-condition"><h3>Condition</h3><label><input type="checkbox" value="new" class="condition-filter"> New</label><label><input type="checkbox" value="used" class="condition-filter"> Used</label></div><div class="filter-section filter-tags"><h3>Tags</h3><div id="tagFilters" class="tag-filters"></div></div></div></div></aside><section class="results"><div class="results-head"><div class="results-controls"><button class="filter-toggle" id="filterToggle"><span class="material-symbols-rounded">tune</span> Filters <span id="filterCount"></span></button><div class="sort-control"><button id="sortMenuToggle" class="sort-menu-toggle" aria-label="Sort figures" aria-expanded="false"><span class="material-symbols-rounded sort-icon">swap_vert</span><span id="sortLabel">Name</span><span class="material-symbols-rounded select-arrow">expand_more</span></button><div id="sortMenu" class="sort-menu" role="menu" hidden><button data-sort-field="name">Name</button><button data-sort-field="brand">Brand</button><button data-sort-field="value">Value</button><hr><button data-sort-direction="asc">Ascending</button><button data-sort-direction="desc">Descending</button></div></div></div></div><div id="catalogue" class="catalogue"></div><div id="empty" class="empty-state" hidden><span class="material-symbols-rounded">search_off</span><h2>No figures found</h2><p>Try a different search or clear the active filters.</p><button id="resetEmpty">Clear filters</button></div></section></section>
  </main>
  <dialog id="detail"><button class="close" id="closeDetail" aria-label="Close"><span class="material-symbols-rounded">close</span></button><div id="detailContent"></div></dialog>
  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle"><div class="confirm-copy"><h2 id="confirmTitle">Confirm change</h2><p id="confirmMessage"></p><div class="confirm-actions"><button type="button" id="cancelConfirm">Cancel</button><button type="button" id="acceptConfirm">Confirm</button></div></div></dialog>
  <template id="cardTemplate"><article class="card"><button class="image-button"><div class="image-wrap"><img loading="lazy"><span class="placeholder">MINIFIG</span></div><span class="condition condition-overlay"></span></button><div class="card-body"><span class="condition condition-list"></span><p class="brand"></p><h2></h2><div class="card-bottom"><span class="price"></span><div class="actions"><button class="own" title="Toggle owned status" aria-label="Toggle owned status"><span class="material-symbols-rounded">check</span></button><button class="wish" title="Toggle wishlist status" aria-label="Toggle wishlist status"><span class="material-symbols-rounded">favorite</span></button></div></div></div></article></template>
  <script src="app.js?v=20260718-3"></script>
</body></html>
